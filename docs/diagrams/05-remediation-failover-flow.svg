<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Sequence: you click Fail Over on an incident. The dashboard posts to the engine's incident action endpoint. The engine reads the demo service's current admin state, then posts the opposite backend to the admin backend endpoint. The engine marks the incident verifying in SQLite, then verified or rolled back automatically once probes confirm whether the metric actually improved. On the next chat request, the llm_call span's backend attribute shows backup.">
  <rect width="100%" height="100%" fill="#ffffff"/>
          <defs>
            <marker id="arrow-d5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#12181f"/>
            </marker>
          </defs>
          <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
            <!-- lifelines -->
            <text x="90" y="30" text-anchor="middle" font-weight="600" fill="#12181f">You</text>
            <text x="330" y="30" text-anchor="middle" font-weight="600" fill="#12181f">Engine (:8500)</text>
            <text x="570" y="30" text-anchor="middle" font-weight="600" fill="#12181f">Demo service (:8000)</text>
            <text x="770" y="30" text-anchor="middle" font-weight="600" fill="#12181f">SQLite</text>
            <line x1="90" y1="42" x2="90" y2="370" stroke="#dde2e9" stroke-dasharray="4 4"/>
            <line x1="330" y1="42" x2="330" y2="370" stroke="#dde2e9" stroke-dasharray="4 4"/>
            <line x1="570" y1="42" x2="570" y2="370" stroke="#dde2e9" stroke-dasharray="4 4"/>
            <line x1="770" y1="42" x2="770" y2="370" stroke="#dde2e9" stroke-dasharray="4 4"/>

            <line x1="90" y1="70" x2="322" y2="70" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d5)"/>
            <text x="100" y="63" fill="#12181f">click "Fail over to backup"</text>

            <line x1="330" y1="105" x2="562" y2="105" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d5)"/>
            <text x="340" y="98" fill="#12181f">GET /admin/state</text>

            <line x1="570" y1="140" x2="338" y2="140" stroke="#5b6675" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-d5)"/>
            <text x="360" y="133" fill="#5b6675">active_backend: "primary"</text>

            <text x="340" y="168" fill="#5b6675" font-size="10.5">other = "backup" if current == "primary" else "primary"</text>

            <line x1="330" y1="195" x2="562" y2="195" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-d5)"/>
            <text x="340" y="188" fill="#2f6fed">POST /admin/backend {backend: "backup"}</text>

            <text x="590" y="222" fill="#12181f" font-size="10.5">state.active_backend = "backup"</text>

            <line x1="330" y1="250" x2="762" y2="250" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d5)"/>
            <text x="340" y="243" fill="#12181f">UPDATE incidents SET status='verifying'</text>

            <line x1="20" y1="285" x2="820" y2="285" stroke="#dde2e9"/>
            <text x="420" y="305" text-anchor="middle" fill="#5b6675" font-size="11">— 5 probes compare the metric before vs. after, then auto-verify or auto-rollback —</text>

            <line x1="570" y1="330" x2="762" y2="330" stroke="#1a9d5c" stroke-width="1.3" marker-end="url(#arrow-d5)"/>
            <text x="580" y="323" fill="#1a9d5c">status → 'verified' (or 'rolled_back' + re-flip)</text>
          </g>
        </svg>