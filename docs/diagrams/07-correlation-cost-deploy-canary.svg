<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="610" viewBox="0 0 840 610" role="img" aria-label="Continuing from diagnose(): a deployment note is appended if the service restarted within the last 120 seconds. Then a decision: is there already an open incident for the same root-cause stage within the last 60 seconds? If yes, merge this detector into that incident and stop — no new incident is created. If no, get the recommended remediation action. Then a second decision: is the action fail-over, on a brand new incident? If yes, run a canary comparison that probes both backends three times each and restores the original, attaching the result. Either way, the incident is created carrying its stage and canary result, and an alert is delivered.">
  <rect width="100%" height="100%" fill="#ffffff"/>
          <defs>
            <marker id="arrow-d7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#12181f"/>
            </marker>
            <marker id="arrow-d7-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/>
            </marker>
          </defs>
          <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">
            <rect x="310" y="20" width="220" height="44" rx="8" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
            <text x="420" y="47" text-anchor="middle" fill="#2f6fed">rootcause.diagnose()</text>

            <line x1="530" y1="42" x2="558" y2="42" stroke="#5b6675" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-d7-dim)"/>
            <rect x="560" y="14" width="230" height="56" rx="6" fill="none" stroke="#5b6675" stroke-width="1" stroke-dasharray="3 3"/>
            <text x="675" y="36" text-anchor="middle" fill="#12181f" font-size="11">+ deployment note</text>
            <text x="675" y="54" text-anchor="middle" fill="#5b6675" font-size="10">if restart &lt;120s ago</text>

            <line x1="420" y1="64" x2="420" y2="96" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d7)"/>

            <polygon points="420,96 476,131 420,166 364,131" fill="#ffffff" stroke="#12181f" stroke-width="1.3"/>
            <text x="420" y="126" text-anchor="middle" font-size="10">existing incident,</text>
            <text x="420" y="140" text-anchor="middle" font-size="10">same stage, &lt;60s?</text>

            <line x1="476" y1="131" x2="558" y2="131" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d7)"/>
            <text x="500" y="124" text-anchor="middle" font-size="10.5">yes</text>
            <rect x="560" y="108" width="240" height="46" rx="6" fill="#ffffff" stroke="#12181f" stroke-width="1.3"/>
            <text x="680" y="135" text-anchor="middle" fill="#12181f" font-size="11">merge_detector_into_incident()</text>
            <line x1="680" y1="154" x2="680" y2="174" stroke="#5b6675" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-d7-dim)"/>
            <circle cx="680" cy="178" r="4" fill="none" stroke="#5b6675" stroke-width="1.2"/>
            <text x="692" y="182" font-size="10" fill="#5b6675">merged — no new incident</text>

            <text x="432" y="190" text-anchor="middle" font-size="10.5" fill="#2f6fed">no</text>
            <line x1="420" y1="166" x2="420" y2="206" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#arrow-d7)"/>

            <rect x="310" y="206" width="220" height="44" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
            <text x="420" y="233" text-anchor="middle" fill="#2f6fed">remediation.recommend()</text>

            <line x1="420" y1="250" x2="420" y2="282" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d7)"/>

            <polygon points="420,282 476,317 420,352 364,317" fill="#ffffff" stroke="#12181f" stroke-width="1.3"/>
            <text x="420" y="313" text-anchor="middle" font-size="10">action == fail_over,</text>
            <text x="420" y="327" text-anchor="middle" font-size="10">new incident?</text>

            <text x="500" y="310" text-anchor="middle" font-size="10.5" fill="#5b6675">no</text>
            <path d="M476,317 L700,317 L700,498 L562,498" fill="none" stroke="#5b6675" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-d7-dim)"/>

            <text x="432" y="372" text-anchor="middle" font-size="10.5" fill="#2f6fed">yes</text>
            <line x1="420" y1="352" x2="420" y2="384" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#arrow-d7)"/>

            <rect x="300" y="384" width="240" height="52" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
            <text x="420" y="406" text-anchor="middle" fill="#2f6fed" font-size="11.5">canary.compare_backends()</text>
            <text x="420" y="424" text-anchor="middle" fill="#5b6675" font-size="10">3 probes/side, restores original</text>

            <line x1="420" y1="436" x2="420" y2="470" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#arrow-d7)"/>

            <rect x="280" y="470" width="280" height="56" rx="8" fill="#eef1f6" stroke="#12181f" stroke-width="1.3"/>
            <text x="420" y="494" text-anchor="middle" fill="#12181f" font-size="11.5">storage.create_incident()</text>
            <text x="420" y="512" text-anchor="middle" fill="#5b6675" font-size="10">stage · canary_result · merged_detectors</text>

            <line x1="420" y1="526" x2="420" y2="556" stroke="#2f6fed" stroke-width="1.3"/>
            <rect x="230" y="556" width="380" height="26" rx="6" fill="none" stroke="#2f6fed" stroke-width="1.3"/>
            <text x="420" y="573" text-anchor="middle" fill="#2f6fed" font-size="11">incident row written + alert delivered</text>
          </g>
        </svg>