<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="610" viewBox="0 0 840 610" role="img" aria-label="Spans split into a recent 90 second window and a baseline 900 second window. Both feed six detector rules. If no rule crosses its threshold, the sweep waits 15 seconds and tries again. If a rule fires but an incident for that detector is already open within the last 180 seconds, it's suppressed and that incident's last-seen time is refreshed. Otherwise the anomaly goes to root-cause diagnosis, then a remediation recommendation, then gets written as an incident and logged as an alert.">
  <rect width="100%" height="100%" fill="#ffffff"/>
          <defs>
            <marker id="arrow-d4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#12181f"/>
            </marker>
            <marker id="arrow-d4-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/>
            </marker>
          </defs>
          <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">
            <rect x="340" y="20" width="160" height="42" rx="6" fill="#eef1f6" stroke="#12181f" stroke-width="1.2"/>
            <text x="420" y="46" text-anchor="middle" fill="#12181f">spans (SQLite)</text>

            <line x1="400" y1="62" x2="280" y2="106" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d4)"/>
            <line x1="440" y1="62" x2="560" y2="106" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d4)"/>

            <rect x="160" y="108" width="220" height="50" rx="6" fill="#ffffff" stroke="#12181f" stroke-width="1.3"/>
            <text x="270" y="130" text-anchor="middle" fill="#12181f" font-size="11.5">RECENT</text>
            <text x="270" y="147" text-anchor="middle" fill="#5b6675" font-size="10.5">last 90s, n≥3</text>

            <rect x="460" y="108" width="220" height="50" rx="6" fill="#ffffff" stroke="#12181f" stroke-width="1.3"/>
            <text x="570" y="130" text-anchor="middle" fill="#12181f" font-size="11.5">BASELINE</text>
            <text x="570" y="147" text-anchor="middle" fill="#5b6675" font-size="10.5">90–990s ago, n≥3, minus known-bad periods</text>

            <line x1="270" y1="158" x2="270" y2="200" stroke="#12181f" stroke-width="1.1" marker-end="url(#arrow-d4)"/>
            <line x1="570" y1="158" x2="570" y2="200" stroke="#12181f" stroke-width="1.1" marker-end="url(#arrow-d4)"/>

            <g font-size="10.3">
              <rect x="40" y="202" width="116" height="36" rx="18" fill="#eef1f6" stroke="#12181f" stroke-width="1"/>
              <text x="98" y="224" text-anchor="middle" fill="#12181f">latency_spike</text>
              <rect x="168" y="202" width="116" height="36" rx="18" fill="#eef1f6" stroke="#12181f" stroke-width="1"/>
              <text x="226" y="224" text-anchor="middle" fill="#12181f">error_rate</text>
              <rect x="296" y="202" width="116" height="36" rx="18" fill="#eef1f6" stroke="#12181f" stroke-width="1"/>
              <text x="354" y="224" text-anchor="middle" fill="#12181f">timeout</text>
              <rect x="424" y="202" width="116" height="36" rx="18" fill="#eef1f6" stroke="#12181f" stroke-width="1"/>
              <text x="482" y="224" text-anchor="middle" fill="#12181f">invalid_output</text>
              <rect x="552" y="202" width="116" height="36" rx="18" fill="#eef1f6" stroke="#12181f" stroke-width="1"/>
              <text x="610" y="224" text-anchor="middle" fill="#12181f">cost_spike</text>
              <rect x="680" y="202" width="116" height="36" rx="18" fill="#eef1f6" stroke="#12181f" stroke-width="1"/>
              <text x="738" y="224" text-anchor="middle" fill="#12181f">tool_failure</text>
            </g>

            <line x1="420" y1="238" x2="420" y2="266" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d4)"/>

            <polygon points="420,266 468,296 420,326 372,296" fill="#ffffff" stroke="#12181f" stroke-width="1.3"/>
            <text x="420" y="300" text-anchor="middle" font-size="11">anomaly?</text>

            <line x1="468" y1="296" x2="560" y2="296" stroke="#5b6675" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-d4-dim)"/>
            <text x="480" y="289" font-size="10.5" fill="#5b6675">no</text>
            <circle cx="568" cy="296" r="4" fill="none" stroke="#5b6675" stroke-width="1.2"/>
            <text x="580" y="300" font-size="10.5" fill="#5b6675">sweep again in 15s</text>

            <text x="435" y="350" font-size="10.5" fill="#2f6fed">yes</text>
            <line x1="420" y1="326" x2="420" y2="366" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#arrow-d4)"/>

            <polygon points="420,366 468,396 420,426 372,396" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
            <text x="420" y="400" text-anchor="middle" font-size="11" fill="#2f6fed">cooldown?</text>

            <line x1="468" y1="396" x2="560" y2="396" stroke="#5b6675" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-d4-dim)"/>
            <text x="478" y="389" font-size="10.5" fill="#5b6675">yes</text>
            <circle cx="568" cy="396" r="4" fill="none" stroke="#5b6675" stroke-width="1.2"/>
            <text x="580" y="400" font-size="10.5" fill="#5b6675">suppressed + last_seen updated</text>

            <text x="435" y="450" font-size="10.5" fill="#2f6fed">no</text>
            <line x1="420" y1="426" x2="420" y2="466" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#arrow-d4)"/>

            <rect x="320" y="468" width="200" height="42" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
            <text x="420" y="493" text-anchor="middle" fill="#2f6fed">rootcause.diagnose()</text>

            <line x1="420" y1="510" x2="420" y2="528" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#arrow-d4)"/>
            <rect x="300" y="530" width="240" height="42" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.4"/>
            <text x="420" y="555" text-anchor="middle" fill="#2f6fed">remediation.recommend()</text>

            <line x1="420" y1="572" x2="420" y2="580" stroke="#2f6fed" stroke-width="1.3"/>
            <rect x="230" y="580" width="380" height="26" rx="6" fill="none" stroke="#2f6fed" stroke-width="1.3" stroke-dasharray="1 0"/>
            <text x="420" y="597" text-anchor="middle" fill="#2f6fed" font-size="11">incident row written + alert delivered</text>
          </g>
        </svg>