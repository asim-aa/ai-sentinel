<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Your browser polls the Sentinel engine on port 8500 every 3 seconds. The engine sends probe and admin calls to the demo AI service on port 8000. The demo service writes spans into a shared SQLite file; the engine reads and writes checks and incidents in the same file.">
  <rect width="100%" height="100%" fill="#ffffff"/>
          <defs>
            <marker id="arrow-d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#12181f"/>
            </marker>
          </defs>
          <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
            <rect x="40" y="20" width="220" height="46" rx="6" fill="#eef1f6" stroke="#12181f" stroke-width="1.2"/>
            <text x="150" y="48" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#12181f">Your browser</text>

            <rect x="40" y="100" width="340" height="180" rx="8" fill="#ffffff" stroke="#12181f" stroke-width="1.4"/>
            <text x="60" y="126" font-size="11.5" letter-spacing="0.03em" fill="#5b6675">SENTINEL ENGINE · :8500</text>
            <line x1="60" y1="136" x2="360" y2="136" stroke="#dde2e9"/>
            <text x="60" y="160" font-size="12" fill="#12181f">synthetic.py — probe / 60s</text>
            <text x="60" y="182" font-size="12" fill="#12181f">engine.py — sweep / 15s</text>
            <text x="60" y="204" font-size="12" fill="#12181f">dashboard/server.py — /api/*</text>
            <text x="60" y="230" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#5b6675">detectors · rootcause · remediation</text>

            <rect x="500" y="100" width="300" height="180" rx="8" fill="#ffffff" stroke="#12181f" stroke-width="1.4"/>
            <text x="520" y="126" font-size="11.5" letter-spacing="0.03em" fill="#5b6675">DEMO AI SERVICE · :8000</text>
            <line x1="520" y1="136" x2="780" y2="136" stroke="#dde2e9"/>
            <text x="520" y="160" font-size="12" fill="#12181f">POST /chat</text>
            <text x="520" y="182" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#5b6675">auth → retrieval → llm → tool</text>
            <text x="520" y="206" font-size="12" fill="#12181f">POST /admin/fault, /backend</text>
            <text x="520" y="228" font-size="12" fill="#12181f">POST /admin/retrieval, /tools</text>

            <rect x="260" y="330" width="320" height="56" rx="8" fill="#eef1f6" stroke="#12181f" stroke-width="1.2" stroke-dasharray="3 3"/>
            <text x="420" y="352" text-anchor="middle" font-size="12" font-weight="500" fill="#12181f">sentinel.db (SQLite, WAL)</text>
            <text x="420" y="370" text-anchor="middle" font-size="10.5" fill="#5b6675">spans · synthetic_checks · incidents</text>

            <line x1="150" y1="66" x2="150" y2="98" stroke="#12181f" stroke-width="1.3" marker-end="url(#arrow-d1)"/>
            <text x="160" y="86" font-size="10.5" fill="#5b6675">poll /api/* · 3s</text>

            <line x1="380" y1="165" x2="498" y2="165" stroke="#12181f" stroke-width="1.3" marker-end="url(#arrow-d1)"/>
            <text x="392" y="158" font-size="10.5" fill="#5b6675">probe + admin calls</text>

            <line x1="640" y1="280" x2="475" y2="328" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow-d1)"/>
            <text x="560" y="315" font-size="10.5" fill="#2f6fed">spans (write-only)</text>

            <line x1="220" y1="280" x2="335" y2="328" stroke="#12181f" stroke-width="1.3" marker-end="url(#arrow-d1)"/>
            <text x="150" y="315" font-size="10.5" fill="#5b6675">checks · incidents</text>
          </g>
        </svg>