<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" role="img" aria-label="In your browser, a 3 second interval fetches five API endpoints in parallel and renders them to the DOM. On the server, independent of any browser, a synthetic check loop runs every 60 seconds and a detector sweep loop runs every 15 seconds, both writing into SQLite. The browser's fetches only read what these server loops already wrote.">
  <rect width="100%" height="100%" fill="#ffffff"/>
          <defs>
            <marker id="arrow-d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#12181f"/>
            </marker>
          </defs>
          <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
            <text x="20" y="18" fill="#5b6675" font-size="10.5" letter-spacing="0.06em">IN YOUR BROWSER</text>
            <rect x="20" y="26" width="190" height="44" rx="6" fill="#eef1f6" stroke="#12181f" stroke-width="1.2"/>
            <text x="115" y="53" text-anchor="middle" fill="#12181f">setInterval · 3000ms</text>

            <line x1="210" y1="48" x2="258" y2="48" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d6)"/>

            <rect x="260" y="20" width="300" height="60" rx="6" fill="#ffffff" stroke="#12181f" stroke-width="1.3"/>
            <text x="410" y="38" text-anchor="middle" fill="#12181f" font-size="11">Promise.all(5 endpoints)</text>
            <text x="410" y="56" text-anchor="middle" fill="#5b6675" font-size="10">/health /metrics /traces /incidents /fault-state</text>

            <line x1="560" y1="48" x2="608" y2="48" stroke="#12181f" stroke-width="1.2" marker-end="url(#arrow-d6)"/>
            <rect x="610" y="26" width="210" height="44" rx="6" fill="#eef1f6" stroke="#12181f" stroke-width="1.2"/>
            <text x="715" y="53" text-anchor="middle" fill="#12181f">render*() → DOM</text>

            <line x1="20" y1="105" x2="820" y2="105" stroke="#dde2e9"/>
            <text x="20" y="130" fill="#2f6fed" font-size="10.5" letter-spacing="0.06em">ON THE SERVER — independent of any browser</text>

            <rect x="40" y="145" width="330" height="48" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.3"/>
            <text x="205" y="174" text-anchor="middle" fill="#2f6fed">synthetic_check_loop() · every 60s</text>

            <rect x="450" y="145" width="330" height="48" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.3"/>
            <text x="615" y="174" text-anchor="middle" fill="#2f6fed">engine.sweep_loop() · every 15s</text>

            <line x1="205" y1="193" x2="330" y2="233" stroke="#2f6fed" stroke-width="1.2" marker-end="url(#arrow-d6)"/>
            <line x1="615" y1="193" x2="490" y2="233" stroke="#2f6fed" stroke-width="1.2" marker-end="url(#arrow-d6)"/>

            <rect x="260" y="236" width="320" height="48" rx="6" fill="#eef1f6" stroke="#12181f" stroke-width="1.3" stroke-dasharray="3 3"/>
            <text x="420" y="265" text-anchor="middle" fill="#12181f">sentinel.db</text>

            <path d="M 560 80 L 800 80 L 800 260 L 584 260" fill="none" stroke="#5b6675" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-d6)"/>
            <text x="805" y="170" text-anchor="end" fill="#5b6675" font-size="10" transform="rotate(90 805 170)"></text>
            <text x="630" y="76" fill="#5b6675" font-size="10">reads what the server loops already wrote</text>
          </g>
        </svg>