[project]
name = "ai-sentinel"
version = "0.1.0"
description = "A reliability engine for AI services: health checks, failure detection, root-cause analysis, and simulated remediation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_sentinel", "demo_service"]
